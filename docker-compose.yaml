services:
  node0:
    image: minid:latest
    container_name: minid-node0
    command: ["start", "--home", "/root/.minid"]
    volumes:
      - ./testnet/docker/node0/config:/root/.minid/config
      - ./testnet/docker/node0/data:/root/.minid/data
    ports:
      - "26656:26656"
      - "26657:26657"
      - "9090:9090"
      - "1317:1317"
    networks:
      - testnet

  node1:
