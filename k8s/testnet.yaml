---
# ============================================================
# Node 0
# ============================================================
apiVersion: v1
kind: Pod
metadata:
  name: minid-node0
  labels:
    app: minid
    node: node0
spec:
  initContainers:
    - name: copy-config
      image: minid:latest
      imagePullPolicy: Never
      command: ["sh", "-c", "cp /config-readonly/* /config/ && echo '{\"height\":\"0\",\"round\":0,\"step\":0}' > /data/priv_validator_state.json"]
      volumeMounts:
        - name: config-readonly
          mountPath: /config-readonly
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
  containers:
    - name: minid
      image: minid:latest
      imagePullPolicy: Never
      command: ["minid", "start", "--home", "/root/.minid"]
      ports:
        - containerPort: 26656
          name: p2p
        - containerPort: 26657
          name: rpc
        - containerPort: 9090
          name: grpc
        - containerPort: 1317
          name: api
      volumeMounts:
        - name: config
          mountPath: /root/.minid/config
        - name: data
          mountPath: /root/.minid/data
  volumes:
    - name: config-readonly
      configMap:
        name: node0-config
    - name: config
      emptyDir: {}
    - name: data
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minid-node0
spec:
  selector:
    app: minid
    node: node0
  ports:
    - name: p2p
      port: 26656
      targetPort: 26656
    - name: rpc
      port: 26657
      targetPort: 26657
    - name: grpc
      port: 9090
      targetPort: 9090
    - name: api
      port: 1317
      targetPort: 1317
